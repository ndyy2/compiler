[workspace]
resolver = "2"
members = [
    "crates/rpc-cli",
    "crates/rpc-core",
    "crates/rpc-source",
    "crates/rpc-diagnostics",
    "crates/rpc-preprocessor",
    "crates/rpc-lexer",
    "crates/rpc-parser",
    "crates/rpc-ast",
    "crates/rpc-hir",
    "crates/rpc-semantic",
    "crates/rpc-mir",
    "crates/rpc-optimizer",
    "crates/rpc-amx",
    "crates/rpc-backend",
    "crates/rpc-target",
    "crates/rpc-debug",
    "crates/rpc-driver",
    "crates/rpc-test",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
bitflags = "2"
smallvec = "1"
bumpalo = "3"
clap = { version = "4", features = ["derive"] }
codespan-reporting = "0.12"
rpc-lexer = { path = "crates/rpc-lexer" }
rpc-parser = { path = "crates/rpc-parser" }
rpc-ast = { path = "crates/rpc-ast" }
rpc-amx = { path = "crates/rpc-amx" }
rpc-backend = { path = "crates/rpc-backend" }
rpc-driver = { path = "crates/rpc-driver" }
rpc-test = { path = "crates/rpc-test" }



[profile.release]
lto = "thin"
codegen-units = 1
